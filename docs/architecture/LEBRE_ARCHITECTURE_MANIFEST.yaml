    lifecycle_states:
      - "DORMANT"
      - "PROVISIONAL"
      - "ACTIVE"
      - "MATURE"
      - "EVICTED"
  structural_object_types:
    - type: "ObservableFeature"
      capacity_max: 10
      discovery_mechanism: "Bounded probe bank with sequential Wald bounds"
    - type: "TemporalLagTap"
      capacity_max: 5
      discovery_mechanism: "Residual correlation probing"
    - type: "RecurrentInternalState"
      capacity_max: 1
      supported_classes:
        - "LinearScalarState (h_t = lambda * h_{t-1} + u_t)"
        - "GatedScalarState (h_t = (1-g_t)*h_{t-1} + g_t * c_t)"

