known_limitations:
  - id: "LIM-01"
    workloads: ["Task A2", "Task A3", "Task A4"]
    description: "High-order pure shift-register delays exceed scalar recurrence capacity without large lag banks"
    severity: "REPRESENTATIONAL_BOUNDARY"
  - id: "LIM-02"
    workloads: ["Task B4 (Silverbox)"]
    description: "Complex continuous nonlinear physical dynamical system identification favors multidimensional random reservoirs"
    severity: "INDUCTIVE_BIAS_BOUNDARY"
  - id: "LIM-03"
    description: "Micro-regimes with duration < 200 steps do not permit full hysteresis eviction"
    severity: "TIME_HORIZON_BOUNDARY"
  - id: "LIM-04"
    description: "Hardware deployment (MCU latency, energy, complete stack RAM) has not yet been experimentally validated"
    severity: "HARDWARE_DEPLOYMENT_BOUNDARY"

